<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Computer Use</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        overflow: hidden;
      }
      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #0a0a0a;
      }
      .status {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #a3a3a3;
        font: 13px/1.4 system-ui, sans-serif;
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <img id="frame" alt="Live browser viewport" tabindex="0" draggable="false" hidden />
    <div id="status" class="status">Connecting to browser…</div>
    <script>
      const params = new URLSearchParams(location.search);
      const wsParam = params.get("ws");
      const frame = document.getElementById("frame");
      const status = document.getElementById("status");

      if (!wsParam) {
        status.textContent = "Missing CDP WebSocket URL.";
      } else {
        const wsUrl = wsParam.startsWith("ws://") || wsParam.startsWith("wss://")
          ? wsParam
          : "ws://" + wsParam;
        let seq = 1;
        let controlled = false;
        let viewport = null;
        const socket = new WebSocket(wsUrl);

        const send = (method, params = {}) => {
          if (socket.readyState === WebSocket.OPEN) {
            socket.send(JSON.stringify({ id: seq++, method, params }));
          }
        };

        // CDP Input coordinates are CSS pixels of the remote viewport, not
        // pixels of this letterboxed image. Input remains disabled until the
        // parent receives the backend's exclusive-control acknowledgement.
        const point = (event) => {
          if (!viewport || !frame.naturalWidth) return null;
          const rect = frame.getBoundingClientRect();
          const scale = Math.min(rect.width / frame.naturalWidth, rect.height / frame.naturalHeight);
          const left = rect.left + (rect.width - frame.naturalWidth * scale) / 2;
          const top = rect.top + (rect.height - frame.naturalHeight * scale) / 2;
          const px = (event.clientX - left) / scale;
          const py = (event.clientY - top) / scale;
          if (px < 0 || py < 0 || px > frame.naturalWidth || py > frame.naturalHeight) return null;
          return {
            x: px / frame.naturalWidth * viewport.deviceWidth / viewport.pageScaleFactor,
            y: (py / frame.naturalHeight * viewport.deviceHeight - viewport.offsetTop) / viewport.pageScaleFactor,
          };
        };
        const modifiers = (event) => (event.altKey ? 1 : 0) | (event.ctrlKey ? 2 : 0)
          | (event.metaKey ? 4 : 0) | (event.shiftKey ? 8 : 0);
        window.addEventListener("message", (event) => {
          if (event.source !== parent || event.origin !== location.origin) return;
          if (event.data?.type === "browser-control") {
            controlled = event.data.enabled === true;
            frame.style.cursor = controlled ? "auto" : "default";
            if (!controlled) frame.blur();
          }
          if (controlled && event.data?.type === "browser-command" && event.data.method === "Page.reload") {
            send("Page.reload");
          }
        });
        for (const [dom, type] of [["pointerdown", "mousePressed"], ["pointerup", "mouseReleased"], ["pointermove", "mouseMoved"]]) {
          frame.addEventListener(dom, (event) => {
            if (!controlled) return;
            const coordinates = point(event);
            if (!coordinates) return;
            event.preventDefault();
            if (dom === "pointerdown") {
              frame.focus();
              frame.setPointerCapture(event.pointerId);
            }
            send("Input.dispatchMouseEvent", { type, ...coordinates,
              button: event.button === 2 ? "right" : event.button === 1 ? "middle" : "left",
              buttons: event.buttons, clickCount: type === "mouseMoved" ? 0 : 1,
              modifiers: modifiers(event) });
          });
        }
        frame.addEventListener("contextmenu", (event) => { if (controlled) event.preventDefault(); });
        frame.addEventListener("wheel", (event) => {
          if (!controlled) return;
          const coordinates = point(event);
          if (!coordinates) return;
          event.preventDefault();
          send("Input.dispatchMouseEvent", { type: "mouseWheel", ...coordinates,
            deltaX: event.deltaX, deltaY: event.deltaY, modifiers: modifiers(event) });
        }, { passive: false });
        for (const dom of ["keydown", "keyup"]) {
          frame.addEventListener(dom, (event) => {
            if (!controlled || event.isComposing) return;
            event.preventDefault();
            const text = dom === "keydown" && event.key.length === 1 && !event.ctrlKey && !event.metaKey ? event.key : undefined;
            send("Input.dispatchKeyEvent", { type: dom === "keyup" ? "keyUp" : text ? "keyDown" : "rawKeyDown",
              key: event.key, code: event.code, text, modifiers: modifiers(event),
              windowsVirtualKeyCode: event.keyCode });
          });
        }
        frame.addEventListener("paste", (event) => {
          if (!controlled) return;
          event.preventDefault();
          send("Input.insertText", { text: event.clipboardData.getData("text/plain") });
        });

        socket.addEventListener("open", () => {
          send("Page.enable");
          send("Page.startScreencast", { format: "jpeg", quality: 80, everyNthFrame: 1 });
        });

        socket.addEventListener("message", (event) => {
          let msg;
          try {
            msg = JSON.parse(event.data);
          } catch {
            return;
          }
          if (msg.method === "Page.screencastFrame") {
            viewport = msg.params.metadata;
            frame.src = "data:image/jpeg;base64," + msg.params.data;
            frame.hidden = false;
            status.hidden = true;
            send("Page.screencastFrameAck", { sessionId: msg.params.sessionId });
          }
          if (msg.error) {
            status.textContent = msg.error.message || "Browser command failed.";
            status.hidden = false;
          }
        });

        socket.addEventListener("error", () => {
          status.textContent = "Could not connect to the browser session.";
          status.hidden = false;
        });

        socket.addEventListener("close", () => {
          controlled = false;
          status.textContent = "Browser session disconnected. Reconnect the preview.";
          status.hidden = false;
        });
        window.addEventListener("pagehide", () => {
          controlled = false;
          send("Page.stopScreencast");
          socket.close();
        });
      }
    </script>
  </body>
</html>
